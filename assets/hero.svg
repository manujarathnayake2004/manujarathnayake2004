<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Animated Manuja Rathnayake profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#120a2f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7c3aed;#ff3cac;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#ff3cac;#00e5ff;#7c3aed" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff3cac">
        <animate attributeName="stop-color" values="#ff3cac;#00e5ff;#7c3aed;#ff3cac" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#6d5dfc" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1050" cy="100" r="145" fill="url(#orb)" opacity="0.55" filter="url(#soft)">
    <animate attributeName="r" values="120;165;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="320" r="95" fill="#ff3cac" opacity="0.10" filter="url(#soft)">
    <animate attributeName="cx" values="100;220;100" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="url(#neon)" stroke-linecap="round">
    <path d="M70 72 C250 18 350 122 520 74 S830 24 1110 88" stroke-width="2" stroke-opacity="0.38" stroke-dasharray="10 16">
      <animate attributeName="stroke-dashoffset" values="0;-260" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M90 292 C280 230 410 330 610 276 S900 210 1110 260" stroke-width="1.5" stroke-opacity="0.30" stroke-dasharray="5 13">
      <animate attributeName="stroke-dashoffset" values="0;220" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#00e5ff" filter="url(#glow)">
    <circle cx="110" cy="98" r="3"><animate attributeName="cy" values="98;72;98" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="308" cy="52" r="2.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="92" r="3"><animate attributeName="cx" values="870;925;870" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="250" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ff3cac" filter="url(#glow)">
    <circle cx="202" cy="275" r="2.5"><animate attributeName="cx" values="202;255;202" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="304" r="3"><animate attributeName="cy" values="304;270;304" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(78 90)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#10182f" stroke="#00e5ff" stroke-opacity="0.45"/>
    <circle cx="18" cy="16" r="5" fill="#00e5ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="32" y="21" fill="#b8c4e3" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.5">ONLINE</text>
  </g>

  <text x="78" y="180" fill="url(#neon)" filter="url(#glow)" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="2">MANUJA RATHNAYAKE</text>
  <text x="82" y="224" fill="#d6def7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="3">SOFTWARE ENGINEERING  •  GRAPHIC DESIGN  •  AI  •  WEB</text>

  <g transform="translate(82 260)" font-family="Consolas,Menlo,monospace" font-size="15">
    <rect x="0" y="0" width="570" height="46" rx="13" fill="#070b19" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="20" y="29" fill="#7ee787">manuja@github</text>
    <text x="134" y="29" fill="#7aa2f7">:</text>
    <text x="146" y="29" fill="#bb9af7">~/build-the-future</text>
    <text x="323" y="29" fill="#c0caf5">$ create --impact</text>
    <rect x="478" y="16" width="9" height="17" rx="2" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(1010 172)" fill="none" stroke="url(#neon)" filter="url(#glow)">
    <circle r="54" stroke-width="2" stroke-dasharray="8 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
    <ellipse rx="78" ry="25" stroke-width="1.5" stroke-opacity="0.65" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="28" ry="78" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></ellipse>
    <circle r="14" fill="#0b1026" stroke-width="2"/>
    <text x="-8" y="7" fill="#ffffff" stroke="none" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">M</text>
  </g>

  <rect x="0" y="0" width="1200" height="4" fill="url(#neon)" opacity="0.8">
    <animate attributeName="y" values="0;356;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="27" fill="none" stroke="url(#neon)" stroke-opacity="0.45" stroke-width="3">
    <animate attributeName="stroke-opacity" values="0.25;0.75;0.25" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>