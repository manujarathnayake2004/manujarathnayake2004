<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Animated technology matrix with development, design, AI and editing tools">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03111f"/>
    <stop offset="0.5" stop-color="#07142a"/>
    <stop offset="1" stop-color="#020817"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1">
    <stop stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop stop-color="#22d3ee" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.05"/>
  </pattern>
  <style>
    .card{fill:#07111f;fill-opacity:.95;stroke-width:2}
    .name{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
    .sub{font:700 9px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
    .ico{font:800 14px 'Segoe UI',Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>

<rect x="2" y="2" width="1196" height="586" rx="30" fill="url(#bg)" stroke="#0ea5e9" stroke-opacity=".55" stroke-width="2"/>
<rect x="2" y="2" width="1196" height="586" rx="30" fill="url(#grid)"/>

<circle cx="1040" cy="92" r="125" fill="url(#orb)" opacity=".26">
  <animate attributeName="r" values="105;145;105" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="135" cy="505" r="105" fill="#7c3aed" opacity=".06">
  <animate attributeName="cx" values="100;220;100" dur="9s" repeatCount="indefinite"/>
</circle>

<text x="600" y="53" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Animated Technology Matrix</text>
<text x="600" y="78" text-anchor="middle" fill="#22d3ee" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="4">LANGUAGES • FRAMEWORKS • TOOLS • DESIGN • VIDEO • AI</text>
<path d="M390 98H810" stroke="url(#beam)" stroke-width="2"/>

<rect x="75" y="110" width="1050" height="3" rx="2" fill="url(#beam)" opacity=".6">
  <animate attributeName="y" values="110;535;110" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;.65;0" dur="8s" repeatCount="indefinite"/>
</rect>

