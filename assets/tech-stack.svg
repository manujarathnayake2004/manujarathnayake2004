<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-label="Animated technology matrix">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03111f"/>
    <stop offset="0.55" stop-color="#071428"/>
    <stop offset="1" stop-color="#020817"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#38bdf8" stroke-opacity="0.05"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="2" y="2" width="1096" height="586" rx="28" fill="url(#bg)" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.55">
  <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="5s" repeatCount="indefinite"/>
</rect>
<rect x="2" y="2" width="1096" height="586" rx="28" fill="url(#grid)"/>
<circle cx="985" cy="95" r="120" fill="url(#orb)">
  <animate attributeName="r" values="100;135;100" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="110" cy="500" r="75" fill="#7c3aed" opacity="0.07">
  <animate attributeName="opacity" values="0.04;0.12;0.04" dur="6s" repeatCount="indefinite"/>
</circle>

<text x="550" y="43" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Animated Technology Matrix</text>
<text x="550" y="67" text-anchor="middle" fill="#22d3ee" font-family="Consolas,Menlo,monospace" font-size="10" font-weight="700" letter-spacing="3">LANGUAGES • FRAMEWORKS • TOOLS • DESIGN • VIDEO • AI</text>
<path d="M360 83H740" stroke="url(#beam)" stroke-width="2"/>

<!-- safe moving scan beam: does not touch card transforms -->
<rect x="38" y="92" width="1024" height="2" rx="1" fill="url(#beam)" opacity="0">
  <animate attributeName="y" values="92;530;92" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.5;0" dur="9s" repeatCount="indefinite"/>
</rect>

