<g class="f3" transform="translate(55 325)"><rect class="card" width="200" height="72" rx="16" stroke="#0ea5e9"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3.9s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#073b58"/><text class="ico" x="38" y="36" fill="#38bdf8">VS</text><text class="name" x="70" y="31">VS Code</text><text class="sub" x="70" y="49" fill="#38bdf8">EDITOR</text></g>
<g class="f1" transform="translate(280 325)"><rect class="card" width="200" height="72" rx="16" stroke="#ec4899"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4.3s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#35122c"/><text class="ico" x="38" y="36" fill="#f9a8d4">IJ</text><text class="name" x="70" y="31">IntelliJ IDEA</text><text class="sub" x="70" y="49" fill="#f472b6">IDE</text></g>
<g class="f2" transform="translate(505 325)"><rect class="card" width="200" height="72" rx="16" stroke="#f43f5e"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4.9s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#2e1422"/><circle cx="31" cy="27" r="6" fill="#f24e1e"/><circle cx="45" cy="27" r="6" fill="#ff7262"/><circle cx="31" cy="41" r="6" fill="#a259ff"/><circle cx="45" cy="41" r="6" fill="#1abcfe"/><text class="name" x="70" y="31">Figma</text><text class="sub" x="70" y="49" fill="#fb7185">DESIGN</text></g>
<g class="f3" transform="translate(730 325)"><rect class="card" width="200" height="72" rx="16" stroke="#38bdf8"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3.7s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#062b45"/><text class="ico" x="38" y="36" fill="#31a8ff">Ps</text><text class="name" x="70" y="31">Photoshop</text><text class="sub" x="70" y="49" fill="#38bdf8">DESIGN</text></g>
<g class="f1" transform="translate(955 325)"><rect class="card" width="190" height="72" rx="16" stroke="#f59e0b"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4.5s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#3c2104"/><text class="ico" x="38" y="36" fill="#ff9a00">Ai</text><text class="name" x="70" y="31">Illustrator</text><text class="sub" x="70" y="49" fill="#f59e0b">DESIGN</text></g>

<!-- row 4 -->
<g class="f1" transform="translate(250 420)"><rect class="card" width="200" height="72" rx="16" stroke="#8b5cf6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4.6s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#24104f"/><text class="ico" x="38" y="36" fill="#a78bfa">Ae</text><text class="name" x="70" y="31">After Effects</text><text class="sub" x="70" y="49" fill="#a78bfa">MOTION</text></g>
<g class="f2" transform="translate(475 420)"><rect class="card" width="200" height="72" rx="16" stroke="#22d3ee"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3.4s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#07384d"/><text class="ico" x="38" y="36" fill="#67e8f9">CC</text><text class="name" x="70" y="31">CapCut</text><text class="sub" x="70" y="49" fill="#22d3ee">VIDEO EDITING</text></g>
<g class="f3" transform="translate(700 420)"><rect class="card" width="200" height="72" rx="16" stroke="#06b6d4"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4.2s" repeatCount="indefinite"/></rect><circle cx="38" cy="36" r="20" fill="#073244"/><text class="ico" x="38" y="36" fill="#67e8f9">ML</text><text class="name" x="70" y="31">AI / ML</text><text class="sub" x="70" y="49" fill="#22d3ee">FOCUS AREA</text></g>

<!-- moving network particles -->
<path d="M150 520 C340 550 470 515 600 535 S900 560 1050 520" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 10"/>
<circle r="6" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M150 520 C340 550 470 515 600 535 S900 560 1050 520"/></circle>
<circle r="4" fill="#a855f7" filter="url(#glow)"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M1050 520 C900 560 720 515 600 535 S320 550 150 520"/></circle>
<text x="600" y="565" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10" letter-spacing="3">FLOATING CARDS • PULSING BORDERS • SCAN BEAM • NETWORK PARTICLES</text>
</svg>